[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow API: autenticacion (TinyDB) e inventario (Supabase/Postgres) con FastAPI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator==2.3.0",
    "fastapi[standard]==0.162.0",
    "libpass[bcrypt]==1.9.4",
    "pydantic-settings==2.16.2",
    "python-jose[cryptography]==3.5.0",
    "tinydb==4.9.0",
]

[tool.uv]
# D-06: no instalar versiones publicadas hace menos de 3 dias.
exclude-newer = "2026-11-04T00:00:00Z"
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
